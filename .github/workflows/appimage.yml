# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the AppImage, starts it without a display, and keeps it as the artifact "sugo-appimage".
# Used by release.yml (stable releases) and nightly.yml.
name: AppImage

on:
  workflow_call:
    inputs:
      version:
        description: The version the program shows and compares when it looks for updates
        required: true
        type: string
      ref:
        description: The commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-24.04
    # The oldest system the AppImage is meant for (glibc 2.35), pinned like the actions.
    container:
      # ubuntu:22.04
      image: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: bash packaging/appimage/build.sh "$VERSION" "$GITHUB_WORKSPACE/out"

      - name: Start it without a display
        working-directory: out
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./Sugo-x86_64.AppImage --appimage-extract >/dev/null
          test "$(QT_QPA_PLATFORM=offscreen squashfs-root/AppRun --version 2>/dev/null)" = "sugo $VERSION"
          for page in "" timer settings about; do
            bash ../tests/smoke_app.sh squashfs-root/AppRun $page
          done
          rm -rf squashfs-root

      - name: Keep the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sugo-appimage
          path: out/Sugo-x86_64.AppImage
          if-no-files-found: error
