name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: platform
    attributes:
      label: System
      description: Where you would use it. Sugo offers the same on Linux and macOS, so say if it is about one of them only.
      options:
        - Linux and macOS
        - Linux only
        - macOS only
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The need or problem behind the idea.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How Sugo could help
      description: The change you have in mind, and any alternatives you considered.
