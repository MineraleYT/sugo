name: Bug report
description: Something in Sugo doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a work phase
        2. ...
  - type: input
    id: version
    attributes:
      label: Sugo version
      placeholder: e.g. 1.0.0 or 1.0.1-nightly.20261031.1
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: How you installed Sugo
      options:
        - AppImage (Linux)
        - Flatpak (Linux)
        - Distribution package (Linux)
        - Disk image (macOS)
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: On Linux the distribution, desktop and session; on macOS the version and the kind of Mac.
      placeholder: e.g. Fedora 44, KDE Plasma 6.5, Wayland or macOS 15.1, Apple Silicon
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Settings → Advanced → Troubleshooting & Diagnostics → Copy to Clipboard, then paste here. Usernames and personal paths are already removed.
      render: markdown
