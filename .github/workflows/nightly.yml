# SPDX-License-Identifier: GPL-3.0-or-later
# Every push to the branch testing that passes CI becomes the nightly build: a new pre-release
# named after its version, with the AppImage, the macOS disk image (when its build succeeded) and
# nightly.json. The pre-release "nightly" holds
# only the latest nightly.json, the feed the program's update check reads on the nightly channel
# (see src/core/UpdateChecker.h). Daily work goes to dev, which only runs CI; see "Branches" in
# docs/DEVELOPMENT.md.
name: Nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [testing]
  workflow_dispatch:

# A newer change makes the build of an older one pointless: the build jobs of an older run are
# cancelled (their publish job is then skipped). The publish job itself is never cancelled once
# it runs: "gh release upload --clobber" deletes the old nightly.json before uploading the new
# one, and a cancel in between would leave the nightly channel without a feed.
permissions:
  contents: read

jobs:
  version:
    name: Version of this build
    # Only the branch testing becomes a nightly, also when the run is started by hand.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/testing') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    # actions: read to look up this run (the date of the version).
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A pre-release of the version in CMakeLists.txt, the one being prepared; once that version
      # is released (and not bumped yet), of the next patch. So a nightly is always newer than
      # the last release and older than the next one, and nightlies order by date and run number.
      # The date is the day this run was created (UTC), not the commit's: a later run always has
      # a later or equal date and a higher run number, so the versions grow in the order the runs
      # are started, also when testing moves to an older commit; a re-run keeps its version.
      - name: Compute the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(sed -n 's/^project(Sugo VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          # Only a 404 means "not released": any other failure (rate limit, server error) would
          # give a version below the release, which no nightly user would update to.
          if error=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$base" 2>&1 >/dev/null); then
            IFS=. read -r major minor patch <<< "$base"
            base="$major.$minor.$((patch + 1))"
          elif ! grep -q '(HTTP 404)' <<< "$error"; then
            echo "::error::Cannot tell whether v$base is released: $error"
            exit 1
          fi
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          date=$(date -u -d "$created" +%Y%m%d)
          echo "version=$base-nightly.$date.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  appimage:
    needs: version
    concurrency:
      group: nightly-appimage
      cancel-in-progress: true
    uses: ./.github/workflows/appimage.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}

  # Not blocking yet: the nightly build is published without it when it fails.
  macos:
    needs: version
    concurrency:
      group: nightly-macos
      cancel-in-progress: true
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}

  publish:
    name: Publish the nightly build
    needs: [version, appimage, macos]
    # Waits for the macOS build but does not need it; a build cancelled by a newer run skips it.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.appimage.result == 'success' && needs.macos.result != 'cancelled' }}
    # One publish at a time, in the order the runs reach it, each running to its end.
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The whole history, to list what changed since the previous nightly (the tag, not moved yet).
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Download the AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sugo-appimage

      - name: Download the macOS disk image
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sugo-macos

      # Commits whose subject reads as a fix go under Fixes, the others under Highlights.
      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          prev=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          range=${prev:+$prev..}$SHA
          plural() { [ "$1" = 1 ] && echo "$1 $2" || echo "$1 $2s"; }
          changes=$(git rev-list --count --no-merges "$range")
          # grep -c fails when it counts nothing: a nightly built again from the same commit.
          people=$(git log --no-merges --format=%aN "$range" | sort -u | grep -c . || true)
          fix='^(fix|repair)|no longer|crash'
          highlights=$(git log --no-merges --format=%s "$range" | grep -viE "$fix" | sed 's/^/- /')
          fixes=$(git log --no-merges --format=%s "$range" | grep -iE "$fix" | sed 's/^/- /')
          {
            echo "**v$VERSION** · $(plural "$changes" change) from $(plural "$people" contributor)"
            echo
            echo "The branch testing at $SHA, built automatically. It may have bugs; the stable releases are tested."
            echo
            echo "Download Sugo-x86_64.AppImage, make it executable and start it. In Settings → Updates, the Nightly channel keeps it up to date by itself."
            if [ -f Sugo-macOS-universal.dmg ]; then
              echo
              cat <<'EOF'
          On macOS 13 or later (Apple Silicon or Intel), open Sugo-macOS-universal.dmg and drag Sugo to Applications. Sugo is not notarized by Apple, so macOS blocks the first launch: on macOS 15, open System Settings → Privacy & Security and click "Open Anyway" next to the message about Sugo (on macOS 13 and 14, Control-click Sugo in Applications and choose Open), or run `xattr -dr com.apple.quarantine /Applications/Sugo.app` in Terminal. Sugo for macOS installs its updates by itself too (the Nightly channel in Settings → Updates) when it is in a folder it can write to (Applications for an administrator).
          EOF
            fi
            if [ -n "$highlights" ]; then printf '\n## Highlights\n%s\n' "$highlights"; fi
            if [ -n "$fixes" ]; then printf '\n## Fixes\n%s\n' "$fixes"; fi
            if [ -n "$prev" ] && [ "$prev" != "$SHA" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$prev" "$SHA"
            fi
          } > notes.md
          cat notes.md

      # One pre-release per build, tagged v<version> (release.yml skips the nightly tags).
      # The pre-release "nightly" stays as the fixed address of the feed (nightly.json, which the
      # installed programs read) and as the tag the next release notes start from.
      - name: Publish the nightly build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          file=Sugo-x86_64.AppImage
          dmg=Sugo-macOS-universal.dmg
          tag="v$VERSION"
          files=("$file")
          jq -n --arg version "$VERSION" \
                --arg url "https://github.com/$REPO/releases/download/$tag/$file" \
                --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                --argjson size "$(stat -c %s "$file")" \
                --arg page "https://github.com/$REPO/releases/tag/$tag" \
                '{version: $version, url: $url, sha256: $sha256, size: $size, page: $page}' > nightly.json
          # The disk image, when it was built, under its own key: the AppImages read only the others.
          if [ -f "$dmg" ]; then
            files+=("$dmg")
            jq --arg url "https://github.com/$REPO/releases/download/$tag/$dmg" \
               --arg sha256 "$(sha256sum "$dmg" | cut -d' ' -f1)" \
               --argjson size "$(stat -c %s "$dmg")" \
               '. + {macos: {url: $url, sha256: $sha256, size: $size}}' nightly.json > nightly.json.new
            mv nightly.json.new nightly.json
          fi
          cat nightly.json

          title="Sugo Nightly $VERSION (${SHA:0:12})"
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null 2>&1 \
            || gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f sha="$SHA" -F force=true >/dev/null
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$REPO" --prerelease --latest=false --title "$title" --notes-file notes.md
          else
            gh release create "$tag" --repo "$REPO" --prerelease --latest=false --verify-tag --title "$title" --notes-file notes.md
          fi
          gh release upload "$tag" "${files[@]}" nightly.json --repo "$REPO" --clobber

          # The feed last: it must never announce a file that is not there yet. The tag nightly
          # follows the branch testing.
          gh api -X PATCH "repos/$REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null
          pointer="The newest nightly build is [$VERSION](https://github.com/$REPO/releases/tag/$tag). This release only holds nightly.json, the feed the program's update check reads on the Nightly channel."
          if gh release view nightly --repo "$REPO" >/dev/null 2>&1; then
            gh release edit nightly --repo "$REPO" --prerelease --latest=false --title "Sugo Nightly (latest)" --notes "$pointer"
          else
            gh release create nightly --repo "$REPO" --prerelease --latest=false --verify-tag --title "Sugo Nightly (latest)" --notes "$pointer"
          fi
          gh release delete-asset nightly "$file" --repo "$REPO" --yes 2>/dev/null || true # left by the former rolling release
          gh release upload nightly nightly.json --repo "$REPO" --clobber
